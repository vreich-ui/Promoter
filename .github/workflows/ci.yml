name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promoter
          POSTGRES_PASSWORD: promoter
          POSTGRES_DB: promoter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promoter -d promoter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://promoter:promoter@localhost:5432/promoter
      PROMOTER_MCP_KEY: test-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Migrate
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
